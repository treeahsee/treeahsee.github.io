project:
  type: website
  output-dir: _site
  # Run code chunks from the project root so note pages can import modules
  # that live at the top level (e.g. bias_variance_decomp.py).
  execute-dir: project

execute:
  freeze: auto  # cache chunk output; re-run only when the code changes

website:
  title: "treeahsee"
  site-url: https://treeahsee.github.io
  navbar:
    right:
      - text: "About"
        href: about.qmd
      - icon: github
        href: https://github.com/treeahsee
        aria-label: GitHub
      - icon: rss
        href: index.xml
        aria-label: RSS

format:
  html:
    # Warm-notebook theme with an automatic light/dark toggle.
    theme:
      light: theme-light.scss
      dark: theme-dark.scss
    page-layout: article   # single centered readable column
    toc: true
    toc-location: right
    toc-title: "On this page"
    anchor-sections: true
    code-copy: true
    code-tools: false
    fig-align: center
    highlight-style: github
